name: Build experimental GOP kext

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and check Mach-O format
        run: python3 build_mac.py
      - name: Save uninstalled test candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NVGopFramebuffer2803-UNTESTED
          path: dist/NVGopFramebuffer2803-UNTESTED.zip
          if-no-files-found: error
          retention-days: 1
