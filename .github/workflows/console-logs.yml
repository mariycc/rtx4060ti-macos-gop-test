name: Build diagnostic console logger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build diagnostic module without loading it
        run: python3 build_debug_console.py
      - name: Save uninstalled diagnostic candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DebugConsoleFix-UNTESTED
          path: dist/DebugConsoleFix-UNTESTED.zip
          if-no-files-found: error
          retention-days: 1
